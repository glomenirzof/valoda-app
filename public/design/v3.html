<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Вариант 3 — Контраст</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700;800&family=Golos+Text:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&family=Onest:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="base.css">
<style>
  /* Вариант 3 «Контраст»: без карточек, огромная фраза сверху, звук и действия внизу под пальцем, янтарный акцент. */
  :root {
    --bg: #fbfaf6; --surface: #ffffff; --surface-2: #f0eee7;
    --ink: #111111; --ink-2: #333333; --muted: #77756e;
    --line: #e7e4dc; --line-strong: #d3cfc4;
    --primary: #111111; --on-primary: #ffffff;
    --accent: #f2b200; --accent-soft: #fff1c2; --accent-ink: #7a5600;
    --good: #1f8a4c; --warn: #b7791f; --bad: #d63b3b;
    --review-bg: #111111; --review-ink: #ffffff;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.08); --shadow: none;
    --r-card: 20px; --r-btn: 18px; --r-sheet: 28px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0c; --surface: #18181a; --surface-2: #232326;
      --ink: #f6f5f1; --ink-2: #d6d4ce; --muted: #9b9991;
      --line: #26262a; --line-strong: #3a3a3e;
      --primary: #f6f5f1; --on-primary: #0b0b0c;
      --accent: #ffc21a; --accent-soft: #3a2e0a; --accent-ink: #ffd35c;
      --good: #4cc27f; --warn: #e0a84a; --bad: #ff6b6b;
      --review-bg: #f6f5f1; --review-ink: #0b0b0c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0c; --surface: #18181a; --surface-2: #232326;
    --ink: #f6f5f1; --ink-2: #d6d4ce; --muted: #9b9991;
    --line: #26262a; --line-strong: #3a3a3e;
    --primary: #f6f5f1; --on-primary: #0b0b0c;
    --accent: #ffc21a; --accent-soft: #3a2e0a; --accent-ink: #ffd35c;
    --good: #4cc27f; --warn: #e0a84a; --bad: #ff6b6b;
    --review-bg: #f6f5f1; --review-ink: #0b0b0c;
  }

  .phrase-card { flex: 1; display: flex; flex-direction: column; }
  .phrase-card .lv { order: 1; font-size: 42px; line-height: 1.08; letter-spacing: -0.03em; }
  .phrase-card .ru { order: 2; font-size: 20px; margin-top: var(--s3); }
  /* Audio tiles sit at the bottom, right above the main button. */
  .audio { order: 3; margin-top: auto; display: grid; grid-template-columns: 1fr 1fr; gap: var(--s2); }
  .audio button { height: 72px; border-radius: var(--r-card); display: flex; flex-direction: column; gap: var(--s1); align-items: center; justify-content: center; background: var(--surface-2); font-weight: 600; font-size: 14px; transition: transform var(--dur) var(--ease); }
  .audio button:active { transform: scale(.97); }
  .audio .a-play { background: var(--accent); color: #111; }
  .scr-new .hint { order: 4; }
  .scr-new .hint { text-align: center; margin: var(--s3) 0 0; }
  .ru-big { font-size: 38px; line-height: 1.1; letter-spacing: -0.03em; }
  .seg { align-self: stretch; }
  .seg button { flex: 1; justify-content: center; }
  .scr-ex .type-box { margin-top: auto; }
  .type-box textarea { border-width: 0; border-bottom: 2px solid var(--line-strong); border-radius: 0; background: transparent; padding: var(--s3) 0; font-size: 24px; }
  .letters button { background: var(--surface); box-shadow: inset 0 0 0 1px var(--line-strong); }
  .eyebrow { color: var(--ink-2); }
  .eyebrow::before { content: ''; display: inline-block; width: 8px; height: 8px; border-radius: 99px; background: var(--accent); margin-right: var(--s2); vertical-align: 1px; }
  .rates.row .rate { min-height: 84px; position: relative; overflow: hidden; }
  .rates.row .rate::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; background: var(--c); }
  .rate-again { --c: var(--bad); } .rate-hard { --c: var(--warn); } .rate-good { --c: var(--good); } .rate-easy { --c: var(--accent); }
  .sheet { border-radius: var(--r-sheet) var(--r-sheet) 0 0; }
</style>
</head>
<body>
<div id="app"></div>
<script src="proto.js"></script>
<script>Proto.start({ title: '3 · Контраст', fonts: 'C', rating: 'row' });</script>
</body>
</html>
