<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Вариант 2 — Пилюли</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700;800&family=Golos+Text:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans:wght@400;500;600;700;800&family=Onest:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="base.css?v=7">
<style>
  /* Вариант 2 «Пилюли»: тёплый серый фон, всё по центру, круглая кнопка звука, кнопки-пилюли, зелёный акцент. */
  :root {
    --bg: #f3f3ef; --surface: #ffffff; --surface-2: #e9e9e4;
    --ink: #121212; --ink-2: #363636; --muted: #6f6f6a;
    --line: #e2e2dc; --line-strong: #cfcfc8;
    --primary: #121212; --on-primary: #ffffff;
    --accent: #14946a; --accent-soft: #dcf2e9; --accent-ink: #0c7452;
    --good: #14946a; --warn: #b7791f; --bad: #d63b3b;
    --review-bg: #121212; --review-ink: #ffffff;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.1); --shadow: 0 8px 30px rgba(0,0,0,.07);
    --r-card: 28px; --r-btn: 999px; --r-sheet: 32px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #000000; --surface: #161616; --surface-2: #222222;
      --ink: #f4f4f0; --ink-2: #d2d2cc; --muted: #94948e;
      --line: #262626; --line-strong: #383838;
      --primary: #f4f4f0; --on-primary: #000000;
      --accent: #2fc28c; --accent-soft: #0f2e22; --accent-ink: #5ee0ad;
      --good: #2fc28c; --warn: #e0a84a; --bad: #ff6b6b;
      --review-bg: #f4f4f0; --review-ink: #000000;
      --shadow: 0 0 0 1px #262626;
    }
  }
  :root[data-theme="dark"] {
    --bg: #000000; --surface: #161616; --surface-2: #222222;
    --ink: #f4f4f0; --ink-2: #d2d2cc; --muted: #94948e;
    --line: #262626; --line-strong: #383838;
    --primary: #f4f4f0; --on-primary: #000000;
    --accent: #2fc28c; --accent-soft: #0f2e22; --accent-ink: #5ee0ad;
    --good: #2fc28c; --warn: #e0a84a; --bad: #ff6b6b;
    --review-bg: #f4f4f0; --review-ink: #000000;
    --shadow: 0 0 0 1px #262626;
  }

  .scr-new, .scr-ex { text-align: center; }
  .scr-new .eyebrow, .scr-ex .eyebrow { align-self: center; padding: 6px 12px; border-radius: 999px; background: var(--surface); text-transform: none; letter-spacing: 0; font-size: 14px; color: var(--ink-2); }
  .phrase-card { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: var(--s2); }
  .phrase-card .lv { order: 2; font-size: 32px; line-height: 1.2; margin-top: var(--s4); }
  .phrase-card .ru { order: 3; font-size: 18px; }
  .audio { order: 1; display: flex; align-items: center; gap: var(--s3); }
  .audio span { display: none; }
  .audio .a-play { width: 104px; height: 104px; border-radius: 999px; display: grid; place-items: center; background: var(--accent); color: #fff; box-shadow: 0 10px 30px color-mix(in srgb, var(--accent) 35%, transparent); transition: transform var(--dur) var(--ease); }
  .audio .a-play .ic { width: 44px; height: 44px; }
  .audio .a-slow { width: 56px; height: 56px; border-radius: 999px; display: grid; place-items: center; background: var(--surface); box-shadow: var(--shadow-sm); transition: transform var(--dur) var(--ease); }
  .audio button:active { transform: scale(.94); }
  .scr-new .hint { margin-bottom: var(--s3); }
  .ru-big { font-size: 30px; line-height: 1.2; margin-top: var(--s4); }
  .seg { align-self: center; background: var(--surface); box-shadow: var(--shadow-sm); }
  .seg button.on { background: var(--primary); color: var(--on-primary); box-shadow: none; }
  .type-box textarea { text-align: center; border-radius: 24px; border-color: transparent; box-shadow: var(--shadow-sm); }
  .letters { justify-content: center; }
  .letters button { border-radius: 999px; background: var(--surface); box-shadow: var(--shadow-sm); }
  /* Floating action pill like a bottom bar. */
  .actions { position: sticky; bottom: calc(env(safe-area-inset-bottom) + var(--s3)); background: var(--surface); border-radius: 999px; padding: 6px; box-shadow: var(--shadow), 0 2px 8px rgba(0,0,0,.06); margin-top: var(--s3); }
  .actions .btn.ghost { background: transparent; }
  .sheet .rates.row .rate { border-radius: 20px; min-height: 58px; }
  .sheet .btn.wide { margin-top: var(--s1); }
  .right { border-radius: 999px; padding: var(--s2) var(--s3) var(--s2) var(--s2); }
</style>
</head>
<body>
<div id="app"></div>
<script src="proto.js?v=7"></script>
<script>Proto.start({ title: '2 · Пилюли', fonts: 'B', rating: 'next' });</script>
</body>
</html>
